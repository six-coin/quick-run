[project]
name = "quick-run"
version = "2.0.0"
description = "Windows 上的快速启动器与操作管理器。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pywebview>=5.0",
    "loguru>=0.7",
    "requests>=2.31",
    "pyperclip>=1.8",
    "pypinyin>=0.44",
    "python-vlc>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
