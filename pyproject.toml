[project]
name = "quick-run"
version = "1.0.0.dev1"
description = "Windows 上的快速启动器与操作管理器。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pywebview>=5.0",
    "loguru>=0.7",
    "requests>=2.31",
    "pyperclip>=1.8",
    "pypinyin>=0.44",
    "python-vlc>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP042 建议改用 StrEnum，但那会改变 str() 的返回值；这两个枚举只用于比较，保持现状。
ignore = ["UP042"]

[tool.ruff.format]
quote-style = "double"
